name: dashboard

on:
  push:
    paths:
      - "services/dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "services/dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci
      - run: npm run audit
