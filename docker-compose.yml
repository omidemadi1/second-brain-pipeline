name: second-brain

# Runs the dashboard (services/dashboard) against the vault in ./vault.
# The pipeline (services/pipeline) is driven by Hermes cron, not by compose.

services:
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    image: second-brain-dashboard:local
    init: true
    restart: unless-stopped

    # Bind to 127.0.0.1 by default. On a VPS behind a reverse proxy, set
    # DASHBOARD_BIND to the docker bridge IP (e.g. 172.17.0.1) - never 0.0.0.0.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8787}:8787"

    environment:
      VAULT_PATH: /repo/vault
      HOST: 0.0.0.0
      PORT: "8787"
      # Used for commits created by the one-click broken-link fix.
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-Second Brain Dashboard}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-dashboard@localhost}"
      GIT_COMMITTER_NAME: "${GIT_AUTHOR_NAME:-Second Brain Dashboard}"
      GIT_COMMITTER_EMAIL: "${GIT_AUTHOR_EMAIL:-dashboard@localhost}"

    # The vault and .git are root-owned on a fresh clone, so the dashboard must
    # be able to rewrite a note and create the link-fix commit.
    user: "0:0"

    # Mount the whole repo, not just ./vault: git needs .git to commit.
    volumes:
      - "${REPO_PATH_HOST:-./}:/repo"
